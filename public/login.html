<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora - Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg-deep: #06060a; --bg-panel: rgba(18, 18, 28, 0.65); --border-glow: rgba(124, 58, 237, 0.3); --p1: #7c3aed; --p2: #ec4899; --text-main: #f8fafc; --text-muted: #94a3b8; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text-main); font: 16px/1.6 'Inter', sans-serif; background-color: var(--bg-deep); background-image: radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%); background-attachment: fixed; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .card { background: var(--bg-panel); border: 1px solid var(--border-glow); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); animation: fadeUp 0.6s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }
  h1 { font-size: 28px; margin: 0 0 8px; text-align: center; background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
  p.sub { color: var(--text-muted); text-align: center; margin-bottom: 30px; font-size: 14px; }
  input { width: 100%; padding: 14px 16px; margin-bottom: 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font: inherit; outline: none; transition: 0.3s; }
  input:focus { border-color: var(--p1); box-shadow: 0 0 15px rgba(124, 58, 237, 0.2); }
  button { width: 100%; padding: 14px; border: none; border-radius: 12px; font: inherit; font-weight: 700; color: white; cursor: pointer; background: linear-gradient(135deg, var(--p1), var(--p2)); transition: 0.2s; margin-bottom: 10px; }
  button:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(236, 72, 153, 0.4); }
  button.secondary { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); }
  button.secondary:hover { background: rgba(255,255,255,0.05); color: white; }
  #message { text-align: center; font-size: 14px; margin-top: 15px; min-height: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Agora.</h1>
    <p class="sub">Connecte-toi pour débattre avec les IA</p>
    
    <div id="signup-form">
      <input type="email" id="signup-email" placeholder="Email" autocomplete="email">
      <input type="password" id="signup-password" placeholder="Mot de passe (6 caractères min)" autocomplete="new-password">
      <button onclick="signUp()">Créer un compte</button>
      <button class="secondary" onclick="toggleForms()">Déjà un compte ? Se connecter</button>
    </div>

    <div id="login-form" class="hidden">
      <input type="email" id="login-email" placeholder="Email" autocomplete="email">
      <input type="password" id="login-password" placeholder="Mot de passe" autocomplete="current-password">
      <button onclick="signIn()">Se connecter</button>
      <button class="secondary" onclick="toggleForms()">Pas de compte ? S'inscrire</button>
    </div>

    <div id="message"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://tcfglmmhxkmfnhmpwkuv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRjZmdsbW1oeGttZm5obXB3a3V2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMTE0NDgsImV4cCI6MjEwODU4NzQ0OH0.1nI4tI7kx9Bgbs6GgwV0WLNyAdZMgXHz5510eBM9Q7E';
    
    // On utilise un nom différent (supabaseClient) pour éviter le conflit
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleForms() {
      document.getElementById('signup-form').classList.toggle('hidden');
      document.getElementById('login-form').classList.toggle('hidden');
      document.getElementById('message').textContent = '';
    }

    async function signUp() {
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      
      // Utilisation de supabaseClient ici
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      
      if (error) {
        document.getElementById('message').textContent = error.message;
        document.getElementById('message').style.color = '#ef4444';
      } else {
        document.getElementById('message').textContent = 'Compte créé ! Redirection...';
        document.getElementById('message').style.color = '#10b981';
        setTimeout(() => window.location.href = '/', 1500);
      }
    }

    async function signIn() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      
      // Utilisation de supabaseClient ici
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        document.getElementById('message').textContent = error.message;
        document.getElementById('message').style.color = '#ef4444';
      } else {
        document.getElementById('message').textContent = 'Connexion réussie ! Redirection...';
        document.getElementById('message').style.color = '#10b981';
        setTimeout(() => window.location.href = '/', 1500);
      }
    }
  </script>
</body>
</html>
