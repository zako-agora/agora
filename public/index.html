<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agora - Le Débat des IA</title>

<!-- 🔥 BALISES POUR L'APPLICATION MOBILE (PWA) 🔥 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06060a">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<!-- ---------------------------------------------- -->

<!-- On garde la police Inter pour le côté moderne -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN FUTURISTE & GLASSMORPHISM
   ========================================================= */
:root {
  --bg-deep: #06060a;
  --bg-panel: rgba(18, 18, 28, 0.65);
  --border-glow: rgba(124, 58, 237, 0.3);
  --p1: #7c3aed; /* Violet */
  --p2: #ec4899; /* Rose */
  --p3: #06b6d4; /* Cyan */
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --card-hover: rgba(255, 255, 255, 0.05);
  --shadow-glow: 0 0 20px rgba(124, 58, 237, 0.2);
}

*{box-sizing:border-box}

body {
  margin: 0;
  color: var(--text-main);
  font: 16px/1.6 'Inter', system-ui, sans-serif;
  background-color: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 50%);
  background-attachment: fixed;
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Animation de fond subtile */
@keyframes pulseBg {
  0% { opacity: 0.8; }
  50% { opacity: 1; }
  100% { opacity: 0.8; }
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 50% -20%, rgba(124, 58, 237, 0.2), transparent 60%);
  animation: pulseBg 10s infinite alternate;
}

.wrap { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 24px 16px 60px; }

/* HEADER */
header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; }
.brand { font-weight: 800; font-size: 24px; letter-spacing: -0.5px; }
.brand b { background: linear-gradient(90deg, var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

.header-right { display: flex; align-items: center; gap: 8px; }

select {
  font: inherit; color: var(--text-main); background: var(--bg-panel);
  border: 1px solid var(--border-glow); border-radius: 12px; padding: 8px 12px;
  backdrop-filter: blur(10px); cursor: pointer; outline: none;
}

/* BOUTON CONNEXION */
.btn-login {
  font-weight: 600; color: #fff; text-decoration: none; 
  background: rgba(255,255,255,0.1); padding: 8px 16px; 
  border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); 
  transition: 0.3s; font-size: 14px;
}
.btn-login:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }

/* HERO SECTION */
.hero { text-align: center; padding: 30px 0 20px; }
.stack { display: flex; justify-content: center; margin-bottom: 24px; }
.stack .av { width: 56px; height: 56px; margin-left: -12px; border: 3px solid var(--bg-deep); font-size: 18px; animation: float 4s ease-in-out infinite; animation-delay: calc(var(--k) * 0.3s); box-shadow: 0 0 15px var(--c); }
.stack .av:first-child { margin-left: 0; }

@keyframes float { 50% { transform: translateY(-10px); } }

h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 0 0 16px; letter-spacing: -1.5px; font-weight: 800; }
h1 em { font-style: normal; background: linear-gradient(90deg, var(--p3), var(--p1), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 30px rgba(124, 58, 237, 0.4); }

.lead { color: var(--text-muted); margin: 0 auto; max-width: 500px; font-size: 1.1rem; }

/* AVATARS GLOBAUX */
.av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; background: var(--c); flex: none; }

/* BARRE DE RECHERCHE */
.ask {
  display: flex; gap: 10px; background: var(--bg-panel);
  border: 1px solid var(--border-glow); border-radius: 20px; padding: 10px;
  box-shadow: var(--shadow-glow); margin-top: 30px;
  backdrop-filter: blur(16px); transition: all 0.3s ease;
}
.ask:focus-within { border-color: var(--p1); box-shadow: 0 0 30px rgba(124, 58, 237, 0.4); transform: translateY(-2px); }
.ask input { flex: 1; min-width: 0; font: inherit; color: var(--text-main); background: transparent; border: 0; padding: 12px 16px; outline: none; }
.ask input::placeholder { color: var(--text-muted); }

.go {
  font: inherit; font-weight: 700; color: #fff; border: 0; border-radius: 14px; padding: 0 24px; cursor: pointer;
  background: linear-gradient(135deg, var(--p1), var(--p2)); transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
}
.go:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6); }
.go:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* CHIPS (Suggestions) */
.chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 20px; }
.chip {
  font: inherit; font-size: 14px; color: var(--text-muted); background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 99px; padding: 8px 16px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(4px);
}
.chip:hover { color: var(--text-main); border-color: var(--p3); background: rgba(6, 182, 212, 0.1); transform: translateY(-2px); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }

/* MESSAGES */
.msg { text-align: center; color: var(--text-muted); font-size: 14px; min-height: 1.6em; margin: 20px 0 10px; }
.msg a { color: var(--p3); font-weight: 600; text-decoration: none; }
.msg a:hover { text-decoration: underline; }

/* ONGLETS (Tabs) */
.tabs { display: flex; gap: 8px; background: rgba(0, 0, 0, 0.4); padding: 6px; border-radius: 16px; margin: 10px 0 20px; border: 1px solid rgba(255, 255, 255, 0.05); }
.tabs button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; color: var(--text-muted); background: transparent; border: 0; border-radius: 12px; padding: 10px; cursor: pointer; transition: all 0.3s; }
.tabs button:hover { color: var(--text-main); }
.tabs .on { background: var(--bg-panel); color: var(--text-main); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); }

/* SYNTHÈSE (Summary) */
.sum { border-radius: 20px; padding: 20px; margin-bottom: 20px; color: #fff; background: linear-gradient(135deg, rgba(124, 58, 237, 0.9), rgba(236, 72, 153, 0.9)); box-shadow: 0 10px 30px rgba(124, 58, 237, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); animation: fadeUp 0.6s both; }
.sum small { opacity: 0.9; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 8px; }
.sum p { margin: 0; font-weight: 500; font-size: 1.05rem; }

/* ARBITRE (conclusion du débat) */
.arb { border-radius: 20px; padding: 20px; margin: 4px 0 16px; color: #fff; background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(124, 58, 237, 0.18)); border: 1px solid rgba(251, 191, 36, 0.45); box-shadow: 0 10px 30px rgba(251, 191, 36, 0.12); backdrop-filter: blur(10px); animation: fadeUp 0.6s both; }
.arb small { display: block; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; font-size: 12px; color: #fbbf24; margin-bottom: 8px; }
.arb p { margin: 0; font-weight: 500; font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
.arb .by { display: block; margin-top: 10px; font-size: 12px; color: var(--text-muted); }

/* CARTES DE RÉPONSES (Glassmorphism) */
.rep {
  display: flex; gap: 16px; background: var(--bg-panel); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; margin-bottom: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px); animation: fadeUp 0.6s both; transition: all 0.3s ease;
}
.rep:hover { background: var(--card-hover); transform: translateY(-4px); border-color: var(--c); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--c); }

@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } }

.rep .av { width: 48px; height: 48px; box-shadow: 0 4px 15px var(--c); }
.rb { min-width: 0; flex: 1; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.nm { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
.pv { font-size: 13px; color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 2px 8px; border-radius: 6px; }

/* Texte des réponses */
.tx { margin: 10px 0 16px; min-height: 2em; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1rem; line-height: 1.7; color: #e2e8f0; }
.tx.err { color: var(--text-muted); font-style: italic; }
.tx.t::after { content: ""; display: inline-block; width: 8px; height: 1.2em; margin-left: 4px; vertical-align: -3px; background: var(--c); border-radius: 2px; animation: blink 0.8s steps(2) infinite; box-shadow: 0 0 10px var(--c); }

@keyframes blink { 50% { opacity: 0; } }

/* BOUTON DE VOTE (Coeur) */
.vt {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text-muted); background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 99px; padding: 6px 16px; cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.vt:hover { border-color: var(--c); color: var(--text-main); background: rgba(255, 255, 255, 0.1); }
.vt.on { color: #fff; background: var(--c); border-color: transparent; box-shadow: 0 0 15px var(--c); }

/* COURONNE (Plébiscitée) */
.crown { font-size: 11px; font-weight: 800; color: #000; background: #fbbf24; border-radius: 99px; padding: 4px 10px; display: none; box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); }
.crown.on { display: inline-block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }

@keyframes popIn { from { transform: scale(0); } }

/* CLASSEMENT (Ranking) */
.rk { display: grid; grid-template-columns: 100px 1fr 40px; gap: 16px; align-items: center; margin: 16px 0; font-size: 15px; font-weight: 600; }
.bar { height: 12px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 50%, #fff)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px var(--c); }

.note { text-align: center; color: var(--text-muted); font-size: 13px; margin: 24px 0 0; }
.hid { display: none; }

/* RESPONSIVE */
@media (max-width: 600px) {
  h1 { font-size: 32px; }
  .ask { flex-direction: column; padding: 8px; }
  .ask input { padding: 12px; }
  .go { padding: 12px; border-radius: 12px; }
  .rk { grid-template-columns: 80px 1fr 30px; font-size: 13px; }
  .rep { padding: 16px; flex-direction: column; gap: 12px; }
  .rep .av { width: 40px; height: 40px; }
}

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Agora<b>.</b></div>
    <div class="header-right">
      <select id="lang" aria-label="Language"><option value="fr">Français</option><option value="en">English</option></select>
      <a href="/login.html" class="btn-login">Connexion</a>
    </div>
  </header>

  <section class="hero">
    <div class="stack" id="stack"></div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <div class="ask"><input id="q" maxlength="500" autocomplete="off"><button class="go" id="go"></button></div>
    <div class="chips" id="chips"></div>
  </section>

  <div class="msg" id="msg" role="status"></div>
  <div class="tabs" id="tabs"><button class="on" data-t="r"></button><button data-t="d"></button><button data-t="k"></button></div>
  <div id="pr"></div><div id="pd" class="hid"></div><div id="pk" class="hid"></div>
  <p class="note" id="foot"></p>
</div>

<script>
const AI={cl:{n:'Claude',c:'#ea580c',i:'C'},gp:{n:'ChatGPT',c:'#059669',i:'G'},ge:{n:'Gemini',c:'#2563eb',i:'Ge'},mi:{n:'Mistral',c:'#d97706',i:'M'},gr:{n:'Grok',c:'#9333ea',i:'X'}};
const ORDER=['cl','gp','ge','mi','gr'];
const T={
  fr:{t1:'Une question.',t2:'Cinq IA',t3:'te répondent.',lead:'Compare les points de vue de plusieurs intelligences artificielles en une seule fois, et vote pour la meilleure réponse.',
    ph:'Pose ta question…',go:'Demander',ex:['Comment arrêter de procrastiner ?','Faut-il apprendre à coder ?','Comment négocier mon salaire ?'],
    tabs:['Réponses','Débat','Classement'],sum:'✨ Synthèse des IA',think:'Les IA réfléchissent…',empty:'Pose une question pour voir les réponses des 5 IA.',
    ai:'IA',crown:'👑 Plébiscitée',nc:'Non configurée',un:'Indisponible pour le moment',rate:'Trop de questions, réessaie dans une minute.',bad:'La question doit faire entre 3 et 500 caractères.',net:'Connexion impossible au serveur.',srv:'Le serveur ne répond pas pour le moment, réessaie dans un instant.',
    allnc:'Aucune IA n’est configurée. Ajoute tes clés dans la page d’administration.',adm:'Ouvrir l’administration',deb:'Les IA réagissent entre elles…',rknote:'Tes votes sur cet appareil',rknoteAll:'Votes de tous les visiteurs',
    foot:'Les réponses sont générées par des intelligences artificielles et peuvent contenir des erreurs.',react:'réagit aux autres',arb:'⚖️ Conclusion de l’arbitre',arbthink:'L’arbitre délibère…',by:'Arbitre :'},
  en:{t1:'One question.',t2:'Five AIs',t3:'answer you.',lead:'Compare the views of several artificial intelligences at once, and vote for the best answer.',
    ph:'Ask your question…',go:'Ask',ex:['How do I stop procrastinating?','Should I learn to code?','How do I negotiate my salary?'],
    tabs:['Answers','Debate','Ranking'],sum:'✨ Summary of the AIs',think:'The AIs are thinking…',empty:'Ask a question to see the 5 AIs’ answers.',
    ai:'AI',crown:'👑 Top pick',nc:'Not configured',un:'Unavailable right now',rate:'Too many questions, try again in a minute.',bad:'The question must be between 3 and 500 characters.',net:'Cannot reach the server.',srv:'The server is not responding right now, try again in a moment.',
    allnc:'No AI is configured. Add your keys in the admin page.',adm:'Open administration',deb:'The AIs are reacting to each other…',rknote:'Your votes on this device',rknoteAll:'Votes from all visitors',
    foot:'Answers are generated by artificial intelligence and may contain mistakes.',react:'reacts to the others',arb:'⚖️ Referee’s conclusion',arbthink:'The referee is deliberating…',by:'Referee:'}
};
const $=s=>document.querySelector(s);
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);Object.assign(e,props);e.append(...kids);return e};
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
let lang='fr';try{lang=localStorage.getItem('lang')||((navigator.language||'fr').startsWith('en')?'en':'fr')}catch(e){}
const t=k=>T[lang][k];
let cur=null,gen=0,busy=false,V={},shared=false;
const rid=()=>((window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,12)).replace(/[^\w-]/g,'');
let VOTER='';try{VOTER=localStorage.getItem('agora-voter')||'';if(!VOTER){VOTER=rid();localStorage.setItem('agora-voter',VOTER)}}catch(e){VOTER=rid()}
try{V=JSON.parse(localStorage.getItem('agora-votes')||'{}')||{}}catch(e){}
const saveV=()=>{try{localStorage.setItem('agora-votes',JSON.stringify(V))}catch(e){}};
const av=(id,extra='')=>{const a=AI[id]||{c:'#666',i:'?'};const e=h('div',{className:'av',textContent:a.i});e.style.cssText='--c:'+a.c+';'+extra;return e};
const color=id=>(AI[id]||{}).c||'#666';

function typeInto(el,text,delay,g){
  el.textContent='';
  if(RM){el.textContent=text;return}
  setTimeout(()=>{
    if(g!==gen)return;
    el.classList.add('t');let n=0;
    const iv=setInterval(()=>{
      if(g!==gen){clearInterval(iv);return}
      el.textContent=text.slice(0,++n);
      if(n>=text.length){clearInterval(iv);el.classList.remove('t')}
    },14);
  },delay);
}
async function post(url,body){
  const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  return{ok:r.ok,status:r.status,data};
}

/* ---------- textes de l'interface ---------- */
function applyLang(){
  document.documentElement.lang=lang;$('#lang').value=lang;
  $('#h1').replaceChildren(t('t1'),h('br'),h('em',{textContent:t('t2')}),' '+t('t3'));
  $('#lead').textContent=t('lead');$('#q').placeholder=t('ph');$('#go').textContent=t('go');$('#foot').textContent=t('foot');
  $('#chips').replaceChildren(...t('ex').map(x=>h('button',{className:'chip',textContent:x})));
  document.querySelectorAll('#tabs button').forEach((b,i)=>b.textContent=t('tabs')[i]);
  if(!cur)render();else{update()}
}
$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('lang',lang)}catch(x){}applyLang()};
$('#stack').replaceChildren(...ORDER.map((id,k)=>av(id,'--k:'+k)));
$('#chips').onclick=e=>{if(e.target.classList.contains('chip')){$('#q').value=e.target.textContent;go()}};

/* ---------- onglet Réponses ---------- */
function render(){
  const pr=$('#pr');pr.replaceChildren();$('#pd').replaceChildren();
  if(!cur){pr.append(h('p',{className:'note',textContent:t('empty')}));update();return}
  const g=gen,me=cur;
  if(cur.summary!==false){
    pr.append(h('div',{className:'sum'},h('small',{textContent:t('sum')}),h('p',{id:'sumt',textContent:cur.summary||t('think')})));
  }
  cur.results.forEach((r,k)=>{
    const tx=h('div',{className:'tx'});
    const crown=h('span',{className:'crown',textContent:t('crown')});crown.dataset.c=r.id;
    const top=h('div',{className:'top'},h('span',{className:'nm',textContent:r.name}),h('span',{className:'pv',textContent:r.company+' · '+t('ai')+(r.ms?' · ⏱ '+(r.ms/1000).toFixed(1)+' s':'')}),crown);
    const kids=[top,tx];
    if(r.error){tx.className='tx err';tx.textContent=r.error==='not_configured'?t('nc'):t('un')}
    else{
      typeInto(tx,r.text,700+k*350,g);
      const vt=h('button',{className:'vt'});vt.dataset.v=r.id;kids.push(vt);
    }
    const card=h('div',{className:'rep'},av(r.id),h('div',{className:'rb'},...kids));
    card.style.setProperty('--c',color(r.id));card.style.animationDelay=(.15+k*.12)+'s';
    pr.append(card);
  });
  update();
}
$('#pr').onclick=async e=>{
  const b=e.target.closest('[data-v]');if(!b||!cur||b.disabled)return;
  const me=cur,id=b.dataset.v,on=!me.voted[id],d=on?1:-1;
  me.voted[id]=on;V[id]=Math.max(0,(V[id]||0)+d);
  if(!shared){saveV();update();return}
  update();b.disabled=true;
  try{
    const r=await post('/api/vote',{qid:me.qid,voter:VOTER,id,on});
    if(r.ok&&r.data.votes)V=r.data.votes;
    else{me.voted[id]=!on;V[id]=Math.max(0,(V[id]||0)-d)}
  }catch(err){me.voted[id]=!on;V[id]=Math.max(0,(V[id]||0)-d)}
  b.disabled=false;update();
};
async function loadVotes(){
  try{
    const r=await fetch('/api/votes');if(!r.ok)return;
    const d=await r.json();
    if(d&&d.votes){V=d.votes;shared=true;update()}
  }catch(e){}
}
function update(){
  const ids=cur?cur.results.filter(r=>!r.error).map(r=>r.id):[];
  const best=ids.reduce((m,id)=>(V[id]||0)>(V[m]||0)?id:m,ids[0]);
  document.querySelectorAll('.crown').forEach(c=>c.classList.toggle('on',!!best&&(V[best]||0)>0&&c.dataset.c===best));
  document.querySelectorAll('.vt').forEach(b=>{
    const id=b.dataset.v,on=!!(cur&&cur.voted[id]);
    b.classList.toggle('on',on);b.style.setProperty('--c',color(id));b.textContent=(on?'❤️ ':'🤍 ')+(V[id]||0);
  });
  const rows=[...ORDER].sort((a,b)=>(V[b]||0)-(V[a]||0)),max=Math.max(1,V[rows[0]]||0);
  $('#pk').replaceChildren(...rows.map(id=>{
    const bar=h('div',{className:'bar'},h('i'));bar.firstChild.style.width=((V[id]||0)/max*100)+'%';
    const row=h('div',{className:'rk'},h('b',{textContent:AI[id].n}),bar,h('b',{textContent:String(V[id]||0)}));
    row.style.setProperty('--c',color(id));return row;
  }),h('p',{className:'note',textContent:t(shared?'rknoteAll':'rknote')}));
}

/* ---------- onglets ---------- */
$('#tabs').onclick=e=>{
  const b=e.target.closest('[data-t]');if(!b)return;
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['r','d','k'].forEach(k=>$('#p'+k).classList.toggle('hid',b.dataset.t!==k));
  if(b.dataset.t==='d')openDebate();
};
const showTab=k=>document.querySelector(`#tabs [data-t="${k}"]`).click();

async function openDebate(){
  if(!cur||cur.debate)return;
  const me=cur,g=gen,pd=$('#pd');
  const answers=answersOf(me);
  if(answers.length<2){pd.replaceChildren(h('p',{className:'note',textContent:t('un')}));return}
  cur.debate='loading';pd.replaceChildren(h('p',{className:'msg',textContent:t('deb')}));
  try{
    const r=await post('/api/debate',{question:me.question,lang:me.lang,answers});
    if(cur!==me)return;
    if(!r.ok){me.debate=null;pd.replaceChildren(h('p',{className:'msg',textContent:r.status===429?t('rate'):t('un')}));return}
    me.debate=r.data.results;
    pd.replaceChildren(...me.debate.filter(x=>!x.error).map((x,k)=>{
      const tx=h('div',{className:'tx rx'});typeInto(tx,x.text,200+k*450,g);
      const card=h('div',{className:'rep'},av(x.id),h('div',{className:'rb'},h('div',{className:'top'},h('span',{className:'nm',textContent:x.name}),h('span',{className:'pv',textContent:t('react')})),tx));
      card.style.setProperty('--c',color(x.id));return card;
    }));
    askVerdict(me,answers,g);
  }catch(e){me.debate=null;pd.replaceChildren(h('p',{className:'msg',textContent:t('net')}))}
}
/* ---------- arbitre : conclusion du débat ---------- */
async function askVerdict(me,answers,g){
  const dres=me.debate.filter(x=>x&&!x.error).map(x=>({id:x.id,name:x.name,text:x.text}));
  if(!dres.length)return;
  const text=h('p',{textContent:t('arbthink')});
  const box=h('div',{className:'arb'},h('small',{textContent:t('arb')}),text);
  $('#pd').append(box);
  try{
    const r=await post('/api/verdict',{question:me.question,lang:me.lang,answers,debate:dres});
    if(cur!==me)return;
    if(r.ok&&r.data.text){
      typeInto(text,r.data.text,300,g);
      box.append(h('span',{className:'by',textContent:t('by')+' '+r.data.by}));
    }else box.remove();
  }catch(e){if(cur===me)box.remove()}
}
