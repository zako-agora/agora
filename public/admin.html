<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Agora – Administration</title>
<style>
:root{--bg:#f7f6fb;--card:#fff;--ink:#16142a;--mut:#6b6885;--line:#e6e3f2;--p1:#7c3aed;--p2:#ec4899;--ok:#059669;--ko:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0b0a16;--card:#14122a;--ink:#f3f1ff;--mut:#9d98c4;--line:#27244a;--ok:#34d399;--ko:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:22px;margin:0}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
select{width:auto;background:var(--card)}
input:focus{outline:2px solid var(--p1);outline-offset:0}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
button{font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
button.p{color:#fff;border:0;background:linear-gradient(90deg,var(--p1),var(--p2))}
button:disabled{opacity:.5;cursor:default}
.row{display:grid;gap:10px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.nm{font-weight:700}
.badge{font-size:12px;border-radius:99px;padding:2px 10px;border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.ko{color:var(--ko);border-color:var(--ko)}
.fields{display:grid;gap:8px;grid-template-columns:2fr 1.3fr}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.btns{display:flex;gap:8px;flex-wrap:wrap}
#gmsg{margin-top:14px;min-height:1.5em;font-size:14px;overflow-wrap:anywhere}
.good{color:var(--ok)}.bad{color:var(--ko)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i="title"></h1>
    <select id="lang" aria-label="Language"><option value="fr">Français</option><option value="en">English</option></select>
  </header>

  <div class="card" id="login">
    <p class="mut" data-i="intro"></p>
    <div class="top"><input id="pw" type="password" autocomplete="current-password" style="flex:1"><button class="p" id="enter"></button></div>
    <div id="lmsg" class="bad" style="margin-top:8px"></div>
  </div>

  <div id="panel" hidden>
    <p class="mut" data-i="help"></p>
    <div id="rows"></div>
    <div id="gmsg" role="status"></div>
  </div>
</div>

<script>
const T={
  fr:{title:'Administration des clés',intro:'Entre le mot de passe d’administration défini dans ton fichier .env (ADMIN_PASSWORD).',pw:'Mot de passe',enter:'Entrer',
    help:'Colle la clé de chaque IA et son nom de modèle, puis enregistre et teste. Les clés restent sur le serveur et ne sont jamais réaffichées en entier.',
    paste:'Colle la clé ici',keep:'laisser vide pour garder',model:'Nom du modèle',save:'Enregistrer',test:'Tester',remove:'Retirer la clé saisie',
    s_admin:'Saisie ici',s_env:'Fichier .env',s_none:'Aucune clé',ready:'Prête',nomodel:'Modèle manquant',
    saved:'Enregistré.',removed:'Clé retirée.',ok:'fonctionne',fail:'erreur',testing:'Test en cours…',nc:'Il faut une clé et un modèle.',
    bad:'Mot de passe incorrect.',disabled:'Administration désactivée : définis ADMIN_PASSWORD dans .env.',rate:'Trop d’essais, attends une minute.',
    bad_key:'Clé invalide (8 à 300 caractères, sans espace).',bad_model:'Nom de modèle invalide.',net:'Serveur injoignable.',sure:'Retirer la clé saisie ici ?'},
  en:{title:'Key administration',intro:'Enter the admin password set in your .env file (ADMIN_PASSWORD).',pw:'Password',enter:'Enter',
    help:'Paste each AI’s key and model name, then save and test. Keys stay on the server and are never shown in full again.',
    paste:'Paste the key here',keep:'leave empty to keep',model:'Model name',save:'Save',test:'Test',remove:'Remove entered key',
    s_admin:'Entered here',s_env:'.env file',s_none:'No key',ready:'Ready',nomodel:'Model missing',
    saved:'Saved.',removed:'Key removed.',ok:'works',fail:'error',testing:'Testing…',nc:'A key and a model are required.',
    bad:'Wrong password.',disabled:'Admin disabled: set ADMIN_PASSWORD in .env.',rate:'Too many attempts, wait a minute.',
    bad_key:'Invalid key (8 to 300 characters, no spaces).',bad_model:'Invalid model name.',net:'Cannot reach the server.',sure:'Remove the key entered here?'}
};
const COLORS={cl:'#ea580c',gp:'#059669',ge:'#2563eb',mi:'#d97706',gr:'#9333ea'};
const $=s=>document.querySelector(s);
let lang=localStorage.getItem('lang')||((navigator.language||'fr').startsWith('en')?'en':'fr');
let pw='',last=[];
const t=k=>T[lang][k]||k;
const h=(tag,props={},...kids)=>{const e=document.createElement(tag);Object.assign(e,props);e.append(...kids);return e};

function say(msg,cls){const g=$('#gmsg');g.textContent=msg;g.className=cls||''}
function applyLang(){
  document.documentElement.lang=lang;$('#lang').value=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#pw').placeholder=t('pw');$('#enter').textContent=t('enter');
  if(last.length)draw(last);
}
$('#lang').onchange=e=>{lang=e.target.value;try{localStorage.setItem('lang',lang)}catch(x){}applyLang()};

async function api(url,method='GET',body){
  const r=await fetch(url,{method,headers:{'content-type':'application/json','x-admin-password':pw},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(d.error||'error'),{code:d.error||'error'});
  return d;
}
const errText=e=>t(e.code)!==e.code?t(e.code):(e.name==='TypeError'?t('net'):e.message);

async function load(){
  try{
    last=await api('/api/admin/status');
    $('#login').hidden=true;$('#panel').hidden=false;draw(last);
  }catch(e){
    $('#lmsg').textContent=e.code==='bad_password'?t('bad'):e.code==='admin_disabled'?t('disabled'):errText(e);
  }
}
$('#enter').onclick=()=>{pw=$('#pw').value;$('#lmsg').textContent='';load()};
$('#pw').onkeydown=e=>{if(e.key==='Enter')$('#enter').click()};

function draw(list){
  const rows=$('#rows');rows.replaceChildren();
  list.forEach(p=>{
    const key=h('input',{type:'password',autocomplete:'off',placeholder:p.hasKey?p.hint+' · '+t('keep'):t('paste')});
    const model=h('input',{type:'text',value:p.model,placeholder:t('model'),autocomplete:'off'});
    const ready=p.hasKey&&p.model;
    const src=p.source==='admin'?t('s_admin'):p.source==='env'?t('s_env'):t('s_none');
    const status=h('span',{className:'badge '+(ready?'ok':'ko'),textContent:ready?t('ready'):(p.hasKey?t('nomodel'):t('s_none'))});
    const btns=h('div',{className:'btns'});
    const save=h('button',{className:'p',textContent:t('save')});
    save.onclick=async()=>{
      save.disabled=true;
      try{await api('/api/admin/keys','POST',{id:p.id,key:key.value,model:model.value});await load();say(p.name+' : '+t('saved'),'good')}
      catch(e){say(p.name+' : '+errText(e),'bad')}
      save.disabled=false;
    };
    const test=h('button',{textContent:t('test')});
    test.onclick=async()=>{
      test.disabled=true;say(p.name+' : '+t('testing'));
      try{
        const d=await api('/api/admin/test','POST',{id:p.id});
        if(d.ok)say(p.name+' : '+t('ok')+' — « '+d.sample+' »','good');
        else say(p.name+' : '+t('fail')+' — '+(d.error==='not_configured'?t('nc'):d.error),'bad');
      }catch(e){say(p.name+' : '+errText(e),'bad')}
      test.disabled=false;
    };
    btns.append(save,test);
    if(p.source==='admin'){
      const rm=h('button',{textContent:t('remove')});
      rm.onclick=async()=>{
        if(!confirm(t('sure')))return;
        try{await api('/api/admin/keys','POST',{id:p.id,remove:true});await load();say(p.name+' : '+t('removed'),'good')}
        catch(e){say(p.name+' : '+errText(e),'bad')}
      };
      btns.append(rm);
    }
    const av=h('div',{className:'av',textContent:p.name[0]});av.style.background=COLORS[p.id]||'#666';
    rows.append(h('div',{className:'card row'},
      h('div',{className:'top'},av,h('div',{},h('div',{className:'nm',textContent:p.name}),h('div',{className:'mut',textContent:p.company+' · '+src})),status),
      h('div',{className:'fields'},key,model),btns));
  });
}
applyLang();
</script>
</body>
</html>
